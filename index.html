<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Офіс — електрика</title>
<style>
  :root{
    --bg:#11111b; --card:#181825; --card2:#1e1e2e; --line:#313244;
    --txt:#cdd6f4; --dim:#9399b2; --green:#a6e3a1; --red:#f38ba8;
    --amber:#f9e2af; --blue:#89b4fa; --teal:#94e2d5; --mauve:#cba6f7;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:24px 16px 40px}
  .wrap{max-width:720px;margin:0 auto}
  h1{font-size:22px;font-weight:600;margin:0 0 4px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:20px}
  .hero{background:var(--card);border-radius:18px;padding:22px;margin-bottom:12px;
    display:flex;align-items:center;gap:18px}
  .dot{width:52px;height:52px;border-radius:50%;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;font-size:26px}
  .hero .state{font-size:20px;font-weight:600;line-height:1.3}
  .hero .note{color:var(--dim);font-size:14px;margin-top:3px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .card{background:var(--card);border-radius:16px;padding:16px}
  .card .lbl{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
  .card .val{font-size:24px;font-weight:600;margin-top:6px}
  .card .unit{font-size:14px;color:var(--dim);font-weight:400;margin-left:3px}
  h2{font-size:14px;color:var(--dim);font-weight:600;margin:26px 0 10px;
    text-transform:uppercase;letter-spacing:.6px}
  .bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:10px}
  .bar > i{display:block;height:100%;border-radius:5px;transition:width .4s}
  footer{color:var(--dim);font-size:12px;margin-top:28px;text-align:center}
  .err{background:var(--card);border:1px solid var(--red);border-radius:16px;
    padding:16px;color:var(--red)}
  .links{display:grid;gap:10px}
  .lnk{display:flex;align-items:center;gap:12px;background:var(--card);
    border-radius:14px;padding:14px 16px;text-decoration:none;color:var(--txt)}
  .lnk:hover{background:var(--card2)}
  .lnk .ic{font-size:20px;flex:0 0 auto}
  .lnk .t{display:block;font-weight:600;font-size:15px}
  .lnk .d{display:block;color:var(--dim);font-size:12px;margin-top:2px}
  .note{color:var(--dim);font-size:12px;margin-top:10px;line-height:1.5}
  .sched{background:var(--card);border-radius:16px;padding:16px}
  .strip{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;margin-top:4px}
  .strip i{position:relative;height:34px;border-radius:3px;background:var(--green);
    display:block;overflow:hidden}
  .strip i.off{background:var(--red)}
  .strip i.first::before,.strip i.second::before{content:"";position:absolute;
    left:0;right:0;height:50%;background:var(--red)}
  .strip i.first::before{top:0}
  .strip i.second::before{bottom:0}
  .strip i.now{outline:2px solid var(--txt);outline-offset:1px}
  .ticks{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;margin-top:6px;
    color:var(--dim);font-size:10px}
  .ticks span{text-align:center}
  .ticks span.hide{visibility:hidden}
  .legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--dim);font-size:12px;margin-top:12px}
  .legend b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;
    vertical-align:-1px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Офіс — електрика</h1>
  <div class="sub" id="updated">Завантаження…</div>
  <div id="app"></div>
  <h2>Графік відключень</h2>
  <div id="sched"></div>

  <div class="links">
    <a class="lnk" href="https://www.dtek-kem.com.ua/ua/shutdowns" target="_blank" rel="noopener">
      <span class="ic">🗓</span>
      <span><span class="t">Графік за адресою</span>
      <span class="d">Сайт ДТЕК: вул. Авіаконструктора Антонова, 2-Б</span></span></a>
    <a class="lnk" href="https://t.me/DTEKKyivskielectromerezhibot" target="_blank" rel="noopener">
      <span class="ic">💬</span>
      <span><span class="t">Бот ДТЕК у Telegram</span>
      <span class="d">Графік, аварії, статус заявки</span></span></a>
    <a class="lnk" href="https://chats.viber.com/dtekkyivskielectromerezhi" target="_blank" rel="noopener">
      <span class="ic">📲</span>
      <span><span class="t">Бот ДТЕК у Viber</span>
      <span class="d">Те саме, якщо зручніше Viber</span></span></a>
  </div>
  <footer>Дані оновлюються автоматично кожні 10 хвилин</footer>
</div>

<script>
const SRC = "https://gist.githubusercontent.com/4evvCQ/c68896e4c0b24caee935bbe88b7914d9/raw/office.json";
const RESERVE = 10;
// Коефіцієнти виміряні на реальних циклах: з 100% SOC знімається ~0.87 паспортної
// ємності, а на заряд до 100% іде ~1.13 (втрати заряджання).
const EFF_OUT = 0.87;
const EFF_IN = 1.13;
const CHG_KW = 3.0;   // типова потужність заряду від мережі

const fmtDur = s => {
  s = Math.max(0, Math.round(s));
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  if (d) return d + " д " + h + " год";
  if (h) return h + " год " + m + " хв";
  return m + " хв";
};

const socColor = v => v >= 50 ? "var(--green)" : v >= 20 ? "var(--amber)" : "var(--red)";

function card(lbl, val, unit, color) {
  return '<div class="card"><div class="lbl">' + lbl + '</div>' +
    '<div class="val"' + (color ? ' style="color:' + color + '"' : '') + '>' + val +
    (unit ? '<span class="unit">' + unit + '</span>' : '') + '</div></div>';
}

function render(d) {
  const now = Date.now() / 1000;
  const on = d.grid === true;
  const since = d.since ? fmtDur(now - d.since) : "";
  const load = (d.load_w || 0) / 1000;
  const hrs = load > 0.05 ? (d.soc - RESERVE) / 100 * d.cap_kwh * EFF_OUT / load : null;

  // Deye-хмара віддає дані раз на ~6 хв, тож одразу після повернення світла
  // тут ще стара потужність розряду — тоді беремо виміряну константу 3.0 кВт.
  const chgRaw = -(d.batt_w || 0) / 1000;        // > 0 коли заряджається
  const chg = chgRaw > 1 ? chgRaw : CHG_KW;
  let eta = null;
  if (on && d.soc < 99) {
    const h = (100 - d.soc) / 100 * d.cap_kwh * EFF_IN / chg;
    const t = new Date(Date.now() + h * 3600 * 1000);
    eta = (h < 1 ? Math.round(h * 60) + " хв" : Math.round(h * 10) / 10 + " год") +
          " · до " + String(t.getHours()).padStart(2, "0") + ":" +
          String(t.getMinutes()).padStart(2, "0");
  }

  let note;
  if (on) {
    note = since ? "Працює від міста вже " + since : "Працює від міста";
    if (eta) note += " · заряд 100% через " + eta;
    else if (d.soc >= 99) note += " · батарея повна";
  }
  else if (hrs === null) note = "Навантаження майже нульове";
  else if (hrs <= 0) note = "Батарея майже порожня";
  else note = "Батареї вистачить ще приблизно на " + (hrs < 1 ? Math.round(hrs * 60) + " хв" : Math.round(hrs) + " год");

  let html = '<div class="hero">' +
    '<div class="dot" style="background:' + (on ? "rgba(166,227,161,.15)" : "rgba(243,139,168,.15)") + '">' +
      (on ? "⚡️" : "🔋") + '</div>' +
    '<div><div class="state" style="color:' + (on ? "var(--green)" : "var(--red)") + '">' +
      (on ? "Світло є" : "Світла немає" + (since ? " вже " + since : "")) + '</div>' +
      '<div class="note">' + note + '</div></div></div>';

  html += '<div class="card"><div class="lbl">Заряд батареї</div>' +
    '<div class="val" style="color:' + socColor(d.soc) + '">' + d.soc + '<span class="unit">%</span></div>' +
    '<div class="bar"><i style="width:' + d.soc + '%;background:' + socColor(d.soc) + '"></i></div></div>';

  html += '<h2>Зараз</h2><div class="grid">' +
    card("Навантаження", (load).toFixed(2), " кВт", "var(--amber)") +
    card("Батарея", (Math.abs(d.batt_w) / 1000).toFixed(2), " кВт", "var(--teal)") +
    card("Напруга мережі", d.grid_v, " В", on ? "var(--blue)" : "var(--dim)") +
    card("Напруга батареї", d.batt_v, " В", "var(--teal)") +
    '</div>';

  const t = d.today || {};
  html += '<h2>Сьогодні</h2><div class="grid">' +
    card("Без світла", on ? "0 год 0 хв" : fmtDur(now - d.since),
         "", on ? "var(--green)" : "var(--red)") +
    card("Відключень", t.outages || 0, "", "var(--mauve)") +
    card("Спожито", t.consumed, " кВт·год", "var(--amber)") +
    card("З мережі", t.purchased, " кВт·год", "var(--mauve)") +
    '</div>';

  const tm = d.temp || {};
  html += '<h2>Температури</h2><div class="grid">' +
    (tm.outside !== undefined ? card("Надворі", tm.outside, " °C", "var(--teal)") : "") +
    card("Батарея", tm.batt, " °C", "var(--blue)") +
    card("AC", tm.ac, " °C", "var(--amber)") +
    card("DC", tm.dc, " °C", "var(--red)") +
    '</div>';

  document.getElementById("app").innerHTML = html;

  const age = now - new Date(d.ts).getTime() / 1000;
  document.getElementById("updated").textContent = "Оновлено " + fmtDur(age) + " тому";
}

async function loadSchedule() {
  const el = document.getElementById("sched");
  try {
    const r = await fetch("dtek.json?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("немає даних");
    const d = await r.json();

    const nowH = new Date().getHours() + 1;
    let strip = "", ticks = "";
    for (let h = 1; h <= 24; h++) {
      const v = d.hours[h] || "yes";
      const cls = [v === "no" ? "off" : v === "first" ? "first" : v === "second" ? "second" : "",
                   h === nowH ? "now" : ""].filter(Boolean).join(" ");
      strip += '<i class="' + cls + '"></i>';
      ticks += '<span class="' + ((h - 1) % 3 ? "hide" : "") + '">' + (h - 1) + '</span>';
    }

    const off = Object.values(d.hours).filter(v => v === "no").length +
                Object.values(d.hours).filter(v => v === "first" || v === "second").length * 0.5;

    el.innerHTML = '<div class="sched">' +
      '<div class="lbl" style="color:var(--dim);font-size:12px">Група ' + d.group +
        ' · за графіком сьогодні без світла ' + off + ' год</div>' +
      '<div class="strip">' + strip + '</div>' +
      '<div class="ticks">' + ticks + '</div>' +
      '<div class="legend">' +
        '<span><b style="background:var(--green)"></b>світло є</span>' +
        '<span><b style="background:var(--red)"></b>відключення за графіком</span>' +
      '</div>' +
      '<div class="note">Оновлено ' + (d.schedule_updated || "—") +
        '. Під час аварійних відключень графік не діє.</div>' +
      '</div>';
  } catch (e) {
    el.innerHTML = '';
  }
}

async function load() {
  try {
    const r = await fetch(SRC + "?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    if (!d || d.soc === undefined) throw new Error("немає даних");
    render(d);
  } catch (e) {
    document.getElementById("app").innerHTML =
      '<div class="err">Не вдалося отримати дані: ' + e.message + '</div>';
    document.getElementById("updated").textContent = "";
  }
}

load();
loadSchedule();
setInterval(load, 60000);
setInterval(loadSchedule, 600000);
</script>
</body>
</html>
