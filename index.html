<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Офіс — електрика</title>
<style>
  :root{
    --bg:#11111b; --card:#181825; --card2:#1e1e2e; --line:#313244;
    --txt:#cdd6f4; --dim:#9399b2; --green:#a6e3a1; --red:#f38ba8;
    --amber:#f9e2af; --blue:#89b4fa; --teal:#94e2d5; --mauve:#cba6f7;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:24px 16px 40px}
  .wrap{max-width:720px;margin:0 auto}
  h1{font-size:22px;font-weight:600;margin:0 0 4px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:20px}
  .hero{background:var(--card);border-radius:18px;padding:22px;margin-bottom:12px;
    display:flex;align-items:center;gap:18px}
  .dot{width:52px;height:52px;border-radius:50%;flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;font-size:26px}
  .hero .state{font-size:20px;font-weight:600;line-height:1.3}
  .hero .note{color:var(--dim);font-size:14px;margin-top:3px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .card{background:var(--card);border-radius:16px;padding:16px}
  .card .lbl{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
  .card .val{font-size:24px;font-weight:600;margin-top:6px}
  .card .unit{font-size:14px;color:var(--dim);font-weight:400;margin-left:3px}
  h2{font-size:14px;color:var(--dim);font-weight:600;margin:26px 0 10px;
    text-transform:uppercase;letter-spacing:.6px}
  .bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:10px}
  .bar > i{display:block;height:100%;border-radius:5px;transition:width .4s}
  footer{color:var(--dim);font-size:12px;margin-top:28px;text-align:center}
  .err{background:var(--card);border:1px solid var(--red);border-radius:16px;
    padding:16px;color:var(--red)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Офіс — електрика</h1>
  <div class="sub" id="updated">Завантаження…</div>
  <div id="app"></div>
  <footer>Дані оновлюються автоматично кожні 10 хвилин</footer>
</div>

<script>
const SRC = "https://gist.githubusercontent.com/4evvCQ/c68896e4c0b24caee935bbe88b7914d9/raw/office.json";
const RESERVE = 10;

const fmtDur = s => {
  s = Math.max(0, Math.round(s));
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  if (d) return d + " д " + h + " год";
  if (h) return h + " год " + m + " хв";
  return m + " хв";
};

const socColor = v => v >= 50 ? "var(--green)" : v >= 20 ? "var(--amber)" : "var(--red)";

function card(lbl, val, unit, color) {
  return '<div class="card"><div class="lbl">' + lbl + '</div>' +
    '<div class="val"' + (color ? ' style="color:' + color + '"' : '') + '>' + val +
    (unit ? '<span class="unit">' + unit + '</span>' : '') + '</div></div>';
}

function render(d) {
  const now = Date.now() / 1000;
  const on = d.grid === true;
  const since = d.since ? fmtDur(now - d.since) : "";
  const load = (d.load_w || 0) / 1000;
  const hrs = load > 0.05 ? (d.soc - RESERVE) / 100 * d.cap_kwh / load : null;

  let note;
  if (on) note = since ? "Працює від міста вже " + since : "Працює від міста";
  else if (hrs === null) note = "Навантаження майже нульове";
  else if (hrs <= 0) note = "Батарея майже порожня";
  else note = "Батареї вистачить ще приблизно на " + (hrs < 1 ? Math.round(hrs * 60) + " хв" : Math.round(hrs) + " год");

  let html = '<div class="hero">' +
    '<div class="dot" style="background:' + (on ? "rgba(166,227,161,.15)" : "rgba(243,139,168,.15)") + '">' +
      (on ? "⚡️" : "🔋") + '</div>' +
    '<div><div class="state" style="color:' + (on ? "var(--green)" : "var(--red)") + '">' +
      (on ? "Світло є" : "Світла немає" + (since ? " вже " + since : "")) + '</div>' +
      '<div class="note">' + note + '</div></div></div>';

  html += '<div class="card"><div class="lbl">Заряд батареї</div>' +
    '<div class="val" style="color:' + socColor(d.soc) + '">' + d.soc + '<span class="unit">%</span></div>' +
    '<div class="bar"><i style="width:' + d.soc + '%;background:' + socColor(d.soc) + '"></i></div></div>';

  html += '<h2>Зараз</h2><div class="grid">' +
    card("Навантаження", (load).toFixed(2), " кВт", "var(--amber)") +
    card("Батарея", (Math.abs(d.batt_w) / 1000).toFixed(2), " кВт", "var(--teal)") +
    card("Напруга мережі", d.grid_v, " В", on ? "var(--blue)" : "var(--dim)") +
    card("Напруга батареї", d.batt_v, " В", "var(--teal)") +
    '</div>';

  const t = d.today || {};
  html += '<h2>Сьогодні</h2><div class="grid">' +
    card("Без світла", fmtDur((t.outage_hours || 0) * 3600), "", "var(--red)") +
    card("Відключень", t.outages || 0, "", "var(--mauve)") +
    card("Спожито", t.consumed, " кВт·год", "var(--amber)") +
    card("З мережі", t.purchased, " кВт·год", "var(--mauve)") +
    '</div>';

  const tm = d.temp || {};
  html += '<h2>Температури</h2><div class="grid">' +
    card("Батарея", tm.batt, " °C", "var(--blue)") +
    card("AC", tm.ac, " °C", "var(--amber)") +
    card("DC", tm.dc, " °C", "var(--red)") +
    '</div>';

  document.getElementById("app").innerHTML = html;

  const age = now - new Date(d.ts).getTime() / 1000;
  document.getElementById("updated").textContent = "Оновлено " + fmtDur(age) + " тому";
}

async function load() {
  try {
    const r = await fetch(SRC + "?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    if (!d || d.soc === undefined) throw new Error("немає даних");
    render(d);
  } catch (e) {
    document.getElementById("app").innerHTML =
      '<div class="err">Не вдалося отримати дані: ' + e.message + '</div>';
    document.getElementById("updated").textContent = "";
  }
}

load();
setInterval(load, 60000);
</script>
</body>
</html>
